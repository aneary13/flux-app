# Format: CATEGORY -> PATTERN -> (STATE or DEFAULT)

SQUAT:
  MAIN: # RED is omitted; the Template for RED days simply won't call SQUAT:MAIN
    GREEN:
      - "Back Squat"
    ORANGE:
      - "Box Squat (Vertical Shin)"
  ACCESSORY:
    GREEN:
      - "SL Knee Extension"
    ORANGE:
      - "SL Knee Extension Iso"

HINGE:
  MAIN:
    DEFAULT:
      - "BB RDL"
  ACCESSORY_HIP:
    DEFAULT:
      - "DB SL RDL"
  ACCESSORY_KNEE:
    DEFAULT:
      - "SL Leg Curl"

PUSH:
  MAIN: # Knee/Energy doesn't change the movement, just the load
    DEFAULT:
      - "BB Bench Press"
  ACCESSORY_HORIZONTAL:
    DEFAULT:
      - "Incline DB Press"
  ACCESSORY_VERTICAL:
    DEFAULT:
      - "Half-kneeling DB OH Press"

PULL:
  MAIN:
    DEFAULT:
      - "Chin Up"
  ACCESSORY_VERTICAL:
    DEFAULT:
      - "Lat Pulldown"
  ACCESSORY_HORIZONTAL:
    DEFAULT:
      - "Chest-supported DB Row"

LUNGE:
  ACCESSORY:
    GREEN:
      - "DB Bulgarian Split Squat"
    ORANGE:
      - "Lunge Iso Hold"

PLYO:
  EXTENSIVE:
    flows:
      - - "Squat Jump"
        - "Single Leg Pogo"
        - "Single Leg Lateral Pogo"
        - "Heiden"
        - "Criss Cross Pogo"
      - - "Scissor Jump"
        - "Single Leg Zig Zag"
        - "Single Leg Lateral Zig Zag"
        - "Heiden"
        - "Rotational Pogo"
  INTENSIVE:
    flows:
      - - "Seated to Vertical Jump"
        - "Seated Broad Jump"
      - - "Single Leg Hop"
        - "Knee to Box Jump"
        - "Band Assisted Push Up"
      - - "Lateral Jump"
        - "Short Contact Depth Jump"
      - - "Band Assisted Single Leg Hop"
        - "Lateral Box Jump"
        - "Band Assisted Push Up"

CORE:
  TRANSVERSE:
    DEFAULT:
      - "Half-kneeling Cable Rotation"
  SAGITTAL:
    DEFAULT:
      - "Hanging Knee Tuck"
  FRONTAL:
    DEFAULT:
      - "DB Side Bend"

ISOMETRIC:
  PATELLAR:
    DEFAULT:
      - "SL Knee Extension Iso"
  HAMSTRING:
    DEFAULT:
      - "SL Foam Roller Hamstring Iso"

MOBILITY:
  DYNAMIC:
    flows:
      - - "Inchworms"
        - "World's Greatest Stretch"
        - "Cat Cow"
        - "Hip Flexor Stretch"
        - "Pigeon Stretch"

# Workout Pairings: defines accessories and intensive plyo set for each anchor pattern
workout_pairings:
  SQUAT:
    intensive_plyo_set: 0
    accessories:
      - "PULL:ACCESSORY_HORIZONTAL"
      - "HINGE:ACCESSORY_HIP"
  PUSH:
    intensive_plyo_set: 1
    accessories:
      - "SQUAT:ACCESSORY"
      - "PULL:ACCESSORY_VERTICAL"
  HINGE:
    intensive_plyo_set: 2
    accessories:
      - "PUSH:ACCESSORY_HORIZONTAL"
      - "LUNGE:ACCESSORY"
  PULL:
    intensive_plyo_set: 3
    accessories:
      - "HINGE:ACCESSORY_KNEE"
      - "PUSH:ACCESSORY_VERTICAL"
